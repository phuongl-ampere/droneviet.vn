name: droneviet-commerce

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: droneviet
      MYSQL_USER: droneviet
      MYSQL_PASSWORD: droneviet
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - droneviet_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -proot --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - droneviet_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  droneviet_mysql_data:
  droneviet_redis_data:
